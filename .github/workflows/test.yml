name: Unit tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  
jobs:

  npm_test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        nodever:
          [
            'latest',
            'lts/*',
            'lts/-1',
            'lts/-2'
          ]
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Setup nodejs
      uses: actions/setup-node@v7
      with:
        node-version: "${{ matrix.nodever }}"
        check-latest: true
    
    - name: set up pnpm
      uses: pnpm/action-setup@v6

    - name: Install dependencies
      run: pnpm ci

    - name: Build
      run: pnpm run build
    
    - name: Run tests
      run: pnpm test
